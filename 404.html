<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found — Mohammad Ihsan Wadid</title>
<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Archivo:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0607;--ink:#EEE8E6;--muted:#A39998;--line:#241A1C;--brand:#7C1628}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 Archivo,system-ui,sans-serif;min-height:100svh;display:flex;flex-direction:column;justify-content:center;padding:0 clamp(18px,4vw,64px)}
.label{font:500 .72rem/1.4 Archivo,sans-serif;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
h1{font:400 clamp(3.2rem,11vw,9rem)/.95 'Bodoni Moda',serif;letter-spacing:-.03em;margin:22px 0 26px}
h1 i{font-style:italic}
p{color:var(--muted);max-width:40ch;font-weight:400}
a.cta{display:inline-flex;gap:12px;margin-top:36px;padding:18px 26px;background:var(--brand);color:var(--ink);text-decoration:none;font:500 .72rem Archivo,sans-serif;letter-spacing:.22em;text-transform:uppercase;align-self:flex-start;transition:background .5s,color .5s}
a.cta:hover{background:var(--ink);color:var(--bg)}
a.cta:focus-visible{outline:1px solid var(--ink);outline-offset:4px}
</style>
</head>
<body>
  <span class="label">(404) — Page not found</span>
  <h1>Nothing <i>here</i></h1>
  <p>This page doesn't exist. The portfolio is one page; everything lives there.</p>
  <a class="cta" href="/">Back to the portfolio ↗</a>
</body>
